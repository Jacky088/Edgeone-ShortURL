<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef4fe">
  <title>EdgeOne ShortURL</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <style>
    :root {
      --primary: #1a5de0; --primary-2: #2c6bff; --primary-deep: #1246b8; --primary-soft: #e8f2fc;
      --teal: #26c4a0;
      --bg-1: #eef4fe; --bg-2: #e2ecfb; --bg-blob-1: rgba(26,93,224,.16); --bg-blob-2: rgba(38,196,160,.16); --bg-blob-3: rgba(124,92,246,.12);
      --surface: #ffffff; --surface-2: #f5f9ff;
      --border: #dfe7f4; --border-strong: #c7d5ec;
      --text: #16233f; --muted: #5d6d92; --faint: #94a3c4;
      --input-bg: #f6f9ff;
      --nav-active-bg: #e8f2fc; --nav-active-text: #1a5de0;
      --shadow: 0 20px 45px -18px rgba(30,70,180,.28);
      --ring: rgba(26,93,224,.22);
      --error: #e5484d; --error-bg: rgba(229,72,77,.08); --error-border: rgba(229,72,77,.4);
      --success: #11906a; --success-bg: rgba(38,196,160,.14);
      --scrim: rgba(18,40,90,.35);
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
    }
    [data-theme="dark"] {
      --primary: #4f8bff; --primary-2: #6ea3ff; --primary-deep: #5c93f8; --primary-soft: rgba(79,139,255,.16);
      --teal: #34d9b4;
      --bg-1: #0a1026; --bg-2: #0e1733; --bg-blob-1: rgba(53,103,255,.26); --bg-blob-2: rgba(52,217,180,.15); --bg-blob-3: rgba(124,120,255,.18);
      --surface: #121b38; --surface-2: #0d1530;
      --border: #253154; --border-strong: #35436e;
      --text: #e7edfb; --muted: #96a6cc; --faint: #6b7ba3;
      --input-bg: #0d1530;
      --nav-active-bg: rgba(79,139,255,.18); --nav-active-text: #8db4ff;
      --shadow: 0 22px 50px -18px rgba(0,0,0,.55);
      --ring: rgba(79,139,255,.35);
      --error: #ff6b70; --error-bg: rgba(255,107,112,.1); --error-border: rgba(255,107,112,.4);
      --success: #3ddcb6; --success-bg: rgba(52,217,180,.14);
      --scrim: rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; }
    html[data-theme="light"] #icon-sun { display: none; }
    html[data-theme="dark"] #icon-moon { display: none; }
    body {
      margin: 0; min-height: 100vh; padding: 88px 20px 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-1));
      display: flex; justify-content: center;
      touch-action: manipulation;
    }
    a, button, input { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .deco { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .deco i { position: absolute; border-radius: 50%; filter: blur(56px); opacity: .9; }
    .deco i:nth-child(1) { width: 340px; height: 340px; left: -80px; top: -60px; background: var(--bg-blob-1); animation: drift 26s ease-in-out infinite alternate; }
    .deco i:nth-child(2) { width: 300px; height: 300px; right: -70px; top: 20%; background: var(--bg-blob-2); animation: drift 32s ease-in-out infinite alternate-reverse; }
    .deco i:nth-child(3) { width: 260px; height: 260px; left: 30%; bottom: -90px; background: var(--bg-blob-3); animation: drift 38s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(40px,-30px,0) scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .deco i { animation: none; } }

    .top-actions { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); z-index: 2; display: flex; gap: 8px; align-items: center; }
    .icon-btn { width: 42px; height: 42px; min-width: 42px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: background-color .18s, border-color .18s; padding: 0; }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .icon-btn svg { width: 20px; height: 20px; }
    .text-btn { height: 42px; padding: 0 15px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: .875rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: background-color .18s, border-color .18s; }
    .text-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .text-btn svg { width: 16px; height: 16px; }

    main {
      position: relative; z-index: 1;
      width: min(620px, 100%);
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: clamp(22px, 4vw, 30px);
      box-shadow: var(--shadow);
      align-self: flex-start;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .brand-logo { width: 42px; height: 42px; border-radius: 10px; box-shadow: 0 8px 18px -8px rgba(26,93,224,.55); display: block; }
    .brand-name { display: block; font-size: 1.2rem; font-weight: 800; }
    .brand-sub { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .divider { width: 44px; height: 3px; margin: 0 0 18px; border-radius: 3px; background: linear-gradient(90deg, var(--primary), var(--teal)); }

    form { display: grid; gap: 12px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    input {
      width: 100%; min-width: 0; height: 48px; padding: 0 16px;
      border: 1px solid var(--border-strong); border-radius: 12px;
      background: var(--input-bg); color: var(--text);
      font-size: .95rem; font-family: inherit;
      transition: border-color .18s, box-shadow .18s;
      -webkit-appearance: none;
    }
    input::placeholder { color: var(--faint); }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring); }
    input:-webkit-autofill { box-shadow: 0 0 0 1000px var(--input-bg) inset; -webkit-text-fill-color: var(--text); caret-color: var(--text); }
    button {
      height: 48px; padding: 0 20px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: #fff; font-weight: 700; font-family: inherit; font-size: .95rem;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 10px 22px -10px rgba(26,93,224,.65), inset 0 1px 0 rgba(255,255,255,.18);
      transition: filter .18s, transform .12s;
    }
    button:hover { filter: brightness(1.06); }
    button:active { transform: translateY(1px) scale(.99); }
    button:disabled { opacity: .65; cursor: not-allowed; filter: saturate(.7); transform: none; }
    .secondary { color: var(--text); background: var(--surface-2); box-shadow: none; border: 1px solid var(--border); }
    .secondary:hover { background: var(--surface-3, #eaf1fc); }

    .hint { margin: 8px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.55; }
    .message { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid transparent; font-size: .88rem; line-height: 1.55; word-break: break-word; }
    .message.error { color: var(--error); border-color: var(--error-border); background: var(--error-bg); }
    .message.success { color: var(--success); border-color: rgba(38,196,160,.35); background: var(--success-bg); }
    .message a { color: var(--primary); font-weight: 700; }
    .copy-btn { margin-left: 10px; height: 30px; padding: 0 12px; border-radius: 9px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); font-size: .8rem; box-shadow: none; }
    .copy-btn:hover { background: var(--border); filter: none; }

    dialog {
      width: min(400px, calc(100% - 32px));
      border: 1px solid var(--border); border-radius: 16px; padding: 26px;
      background: var(--surface); color: var(--text);
      box-shadow: var(--shadow);
    }
    dialog h2 { margin: 0 0 16px; font-size: 1.15rem; }
    dialog::backdrop { background: var(--scrim); }
    .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }

    .features { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .feature { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-size: .8rem; font-weight: 600; }
    .feature .fi { width: 26px; height: 26px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .feature .fi svg { width: 14px; height: 14px; }
    .fi-blue { background: var(--primary); } .fi-teal { background: var(--teal); } .fi-violet { background: #7c5cf6; } .fi-sky { background: #38bdf8; }

    @media (max-width: 560px) {
      main { padding: 20px 16px; }
      .row { grid-template-columns: 1fr; }
      button { width: 100%; }
      input, .row input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="deco" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="top-actions">
    <button class="icon-btn" id="admin-btn" title="管理后台" aria-label="管理后台">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 2.8v5c0 4.6-3.1 7.6-7 9.2-3.9-1.6-7-4.6-7-9.2v-5z"/><path d="M9 12l2 2 4-4.5"/></svg>
    </button>
    <button class="icon-btn" id="theme-toggle" title="切换日间/夜间模式" aria-label="切换日间/夜间模式">
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1.5v2M12 20.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1.5 12h2M20.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
  </div>

  <main>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c6bff"/><stop offset="1" stop-color="#1246b8"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#lg)"/>
        <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(4.6 4.6) scale(0.95)"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g>
      </svg>
      <div>
        <span class="brand-name">Edgeone-ShortURL</span>
        <span class="brand-sub">基于 EO 的一个短链接转换服务</span>
      </div>
    </div>
    <div class="divider"></div>

    <form id="link-form">
      <div class="row">
        <input id="url-input" type="url" placeholder="https://www.example.com/very-long-url" autocomplete="url" enterkeyhint="go" required>
        <button id="submit-btn" type="submit">生成短链</button>
      </div>
      <input id="slug-input" type="text" maxlength="64" placeholder="自定义短链，可选" autocomplete="off" spellcheck="false">
      <p class="hint">仅支持 http/https 开头的完整链接；自定义短链可使用字母、数字、短横线、下划线，最长 64 位。</p>
    </form>

    <div id="message" class="message"></div>

    <div class="features">
      <div class="feature"><span class="fi fi-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6"/><path d="M12.9 8.1l1.5-1.5a3.2 3.2 0 0 1 4.5 4.5l-1.5 1.5"/><path d="M11.1 15.9l-1.5 1.5a3.2 3.2 0 0 1-4.5-4.5l1.5-1.5"/></svg></span>生成短链</div>
      <div class="feature"><span class="fi fi-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></span>快速跳转</div>
      <div class="feature"><span class="fi fi-violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M11.5 20V4M17 20v-9M21 20H3"/></svg></span>数据统计</div>
      <div class="feature"><span class="fi fi-sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 2.8v5c0 4.6-3.1 7.6-7 9.2-3.9-1.6-7-4.6-7-9.2v-5z"/><path d="M9 12l2 2 4-4.5"/></svg></span>安全稳定</div>
    </div>
  </main>

  <dialog id="login-dialog">
    <form id="login-form">
      <h2>登录</h2>
      <input id="password-input" type="password" placeholder="口令" autocomplete="current-password" required>
      <div class="row-btns">
        <button type="submit">登录</button>
        <button class="secondary" type="button" id="close-login">取消</button>
      </div>
    </form>
  </dialog>

  <script>
    const htmlEl = document.documentElement;
    const moon = document.getElementById('icon-moon');
    const sun = document.getElementById('icon-sun');
    function syncIcons(mode) { moon.style.display = mode === 'dark' ? 'none' : 'block'; sun.style.display = mode === 'dark' ? 'block' : 'none'; }
    function setTheme(mode) {
      htmlEl.setAttribute('data-theme', mode);
      try { localStorage.setItem('theme', mode); } catch (e) {}
      syncIcons(mode);
      const mc = document.querySelector('meta[name="theme-color"]');
      if (mc) mc.content = mode === 'dark' ? '#0a1026' : '#eef4fe';
    }
    document.getElementById('theme-toggle').addEventListener('click', () => setTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    syncIcons(htmlEl.getAttribute('data-theme') || 'light');

    const linkForm = document.getElementById('link-form');
    const loginForm = document.getElementById('login-form');
    const loginDialog = document.getElementById('login-dialog');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    function setMessage(type, textOrNode) {
      message.className = 'message ' + type;
      message.style.display = 'block';
      message.textContent = '';
      if (typeof textOrNode === 'string') message.textContent = textOrNode;
      else message.appendChild(textOrNode);
    }

    function showLogin() {
      if (typeof loginDialog.showModal === 'function') loginDialog.showModal();
      else loginDialog.setAttribute('open', '');
    }

    async function createLink(event) {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = '生成中…';

      const payload = { url: document.getElementById('url-input').value.trim() };
      const slug = document.getElementById('slug-input').value.trim();
      if (slug) payload.slug = slug;

      try {
        const res = await fetch('/api/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.status === 401) {
          showLogin();
          setMessage('error', '请先登录，再创建短链接。');
          return;
        }

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Failed to create short link.');

        const shortUrl = window.location.origin + '/' + data.slug;
        const wrapper = document.createElement('span');
        wrapper.append('Created: ');
        const link = document.createElement('a');
        link.href = shortUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = shortUrl;
        wrapper.appendChild(link);
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'copy-btn';
        button.dataset.url = shortUrl; button.textContent = '复制';
        wrapper.appendChild(button);
        setMessage('success', wrapper);
        linkForm.reset();
      } catch (error) {
        setMessage('error', error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '生成短链';
      }
    }

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('copy-btn')) {
        navigator.clipboard.writeText(e.target.dataset.url).then(() => {
          e.target.textContent = '已复制';
          setTimeout(() => { e.target.textContent = '复制'; }, 1500);
        }).catch(() => { e.target.textContent = '复制失败'; });
      }
    });

    async function login(event) {
      event.preventDefault();
      const password = document.getElementById('password-input').value;
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Login failed.');
        if (loginDialog.close) loginDialog.close();
        setMessage('success', '登录成功，现在可以创建短链接了。');
      } catch (error) {
        setMessage('error', error.message);
      }
    }

    document.getElementById('admin-btn').addEventListener('click', () => {
      const path = prompt('管理后台路径');
      if (path) window.location.href = '/' + path.replace(/^\/+/, '');
    });
    document.getElementById('close-login').addEventListener('click', () => loginDialog.close());
    linkForm.addEventListener('submit', createLink);
    loginForm.addEventListener('submit', login);
  </script>
</body>
</html>
